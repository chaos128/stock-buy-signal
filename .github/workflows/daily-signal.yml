name: daily-signal

# 미장 마감 후 1회: 신호 계산 → 스냅샷 저장 → 구독자 fan-out → 이메일.
# 화~토 03:17 UTC = 전날(월~금) 세션 기준 23:17 EDT / 22:17 EST.
# 20:00~21:30 ET(시간외 종료 직후)에 실행하면 Yahoo 가 그날 봉을 안 줘 하루 늦은 봉을 저장한다
#   (실측 7/30~10/28: 이 구간 17회 중 14회 지연, 16~20시 30회·21:40 이후 6회는 0회).
# GitHub cron 은 정각 부하로 수 시간 늦게 돈다(10월 실측 2~5h) — 정각을 피하고, 그만큼 늦어져도
# 21:30 ET 이후 ~ 다음 개장(09:30 ET) 전에 떨어지도록 이 시각을 잡았다. DST 와 무관.
# main.py 는 멱등(주말/휴일 실행 시 마지막 거래일 재처리 + 스로틀로 중복 발송 없음).
on:
  schedule:
    - cron: "17 3 * * 2-6"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python main.py

  # public 저장소는 커밋이 60일 없으면 스케줄이 꺼진다(2026-09-18 실제로 꺼져 9/21~10/1 누락).
  # 매 실행마다 이 워크플로를 공식 enable API 로 다시 켜 비활성 판정을 미룬다 — 더미 커밋은 만들지 않는다.
  # 신호 잡과 분리해 시크릿 없이 actions: write 만 받는다.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-signal.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
